# ===========================================================================
#  生产部署 · CTS 服务器官网
#
#  三个容器，**不发布任何宿主机端口**：
#    db          PostgreSQL 16，只在内部网络
#    app         Next.js standalone（Dockerfile 构建）
#    cloudflared Cloudflare Tunnel，出站连出去把 web.ctserver.top 转到 app
#
#  为什么一个端口都不开：
#    1. 家用宽带的 80/443 入站通常被运营商封，而且路由器上还挂着 7 个
#       MC 相关端口（25565/25566/25567/25601/30000/30001/30002），
#       动 apex 的解析会把他们全打挂 —— 所以 ctserver.top 的 A 记录一个字都不改。
#    2. 会话 cookie 在生产是 `Secure`（见 src/lib/session.ts），浏览器只在
#       HTTPS 下存储它。用 http://<IP>:3000 访问的话登录会静默失败。
#       Cloudflare 边缘提供有效证书，正好解决这一点。
#    3. 源站没有任何入站路径 → `cf-connecting-ip` 可信，
#       所以可以开 TRUST_CF_CONNECTING_IP（按 IP 的限流才准）。
#
#  用法（在 /mcsm/cts/cts-website 下）：
#    docker compose -f docker-compose.prod.yml build
#    docker compose -f docker-compose.prod.yml up -d
#    docker compose -f docker-compose.prod.yml run --rm app npx prisma db push
# ===========================================================================

name: cts-website

services:
  db:
    image: postgres:16-alpine
    container_name: cts-web-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cts}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 必须设置}
      POSTGRES_DB: ${POSTGRES_DB:-cts_website}
      # 中文排序/大小写行为更可预期；建库时生效，之后改没用
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
      TZ: Asia/Shanghai
    volumes:
      - cts_web_pgdata:/var/lib/postgresql/data
    # ⚠️ 故意不写 ports：数据库只在 dbnet 上可达。
    #    dbnet 标了 internal，所以**连局域网都连不进来**（实测过没隔离时
    #    172.20.0.2:5432 从 LAN 是通的）。
    #    需要连进去看数据就用 docker compose exec db psql -U cts cts_website
    healthcheck:
      # pg_isready 比 tcp 检查准：能区分"端口开着但还没接受连接"
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cts} -d ${POSTGRES_DB:-cts_website}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [dbnet]

  app:
    build:
      context: .
      dockerfile: Dockerfile
      # ⚠️ **必须显式写 target**。Dockerfile 里最后一个 stage 是 `migrate`，
      # 不指定 target 的话 `docker compose build app` 会构建成那个 ——
      # app 镜像的 CMD 变成 `prisma db push`，跑完就退出、无限重启。
      target: runner
    image: cts-website:latest
    container_name: cts-web-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      TZ: Asia/Shanghai
      # 容器之间用服务名互相访问
      DATABASE_URL: postgresql://${POSTGRES_USER:-cts}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-cts_website}

      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET 必须设置}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://web.ctserver.top}
      NEXT_PUBLIC_SITE_NAME: ${NEXT_PUBLIC_SITE_NAME:-CTS 服务器}

      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
      MICROSOFT_REDIRECT_URI: ${MICROSOFT_REDIRECT_URI:-https://web.ctserver.top/api/auth/callback}

      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}

      # 源站只有 Cloudflare 一条入站路径 → 它强制覆写的 cf-connecting-ip 可信
      TRUST_PROXY: "1"
      TRUST_CF_CONNECTING_IP: "1"

      # 服务器状态卡片的真实在线人数。
      # MC 的端口映射绑在宿主机上，容器里要通过 host-gateway 访问。
      MC_PING_HOST: ${MC_PING_HOST:-host.docker.internal}
      MC_PING_PORT: ${MC_PING_PORT:-25565}
    extra_hosts:
      # Linux 上 host.docker.internal 需要显式声明才有
      - "host.docker.internal:host-gateway"
    healthcheck:
      # 用 GET（-O /dev/null）而不是 --spider：--spider 发的是 HEAD，
      # 而 Next 的 route handler 只导出了 GET，不保证会应答 HEAD。
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    # 同样的理由：不发布端口，只有 cloudflared 能访问它。
    # 两张网：outbound 用来发邮件（默认路由走它），dbnet 用来连数据库。
    networks:
      outbound:
        priority: 100
      dbnet:
        priority: 10

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cts-web-tunnel
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    # token 从 .env 读，不进仓库。在 Cloudflare Zero Trust →
    # Networks → Tunnels 建一个 tunnel，Public Hostname 填：
    #   web.ctserver.top  →  http://app:3000
    # ⚠️ 千万别填 ctserver.top —— 那会把 apex 的 A 记录改成隧道的 CNAME，
    #    你的 7 个 MC 端口会全部失效。
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?TUNNEL_TOKEN 必须设置}
      TZ: Asia/Shanghai
    # 只需要能连到 app:3000 + 出网连 Cloudflare，不需要碰数据库
    networks: [outbound]

  # ------------------------------------------------------------------
  # 建表 / 同步 schema。**不会跟着 `up -d` 起来**（profiles 把它排除在默认之外）。
  #
  #   docker compose -f docker-compose.prod.yml run --rm migrate
  #
  # 为什么单独一个服务而不是在 app 容器里跑：Prisma CLI 需要完整的
  # node_modules，而 app 用的是 standalone 产物（只含应用真正 import 到的模块），
  # 在里面 `npx prisma db push` 会报 MODULE_NOT_FOUND。
  # 这个服务基于 builder 阶段构建，用完即弃。
  # ------------------------------------------------------------------
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrate
    image: cts-website-migrate:latest
    profiles: ["tools"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cts}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-cts_website}
      TZ: Asia/Shanghai
    networks: [dbnet]

volumes:
  cts_web_pgdata:

networks:
  # 对外那条：有 NAT，app 靠它发验证码邮件，cloudflared 靠它连 Cloudflare。
  outbound:

  # ------------------------------------------------------------------
  # 数据库专用网络，**标记 internal**。
  #
  # 为什么不能三个服务共用一张网：Docker 发布的端口**不走 INPUT 链**
  # （DNAT 之后走 FORWARD，而 FORWARD 默认是 ACCEPT），所以宿主机那套
  # "INPUT 默认 DROP" 的手写规则**盖不住容器网络**。实测过：不隔离的话，
  # 局域网里任意一台机器都能直接连到 `172.20.0.2:5432`。
  #
  # internal: true 会让 Docker 自己加上"只允许本子网"的规则，
  # 而且这些规则是声明式的 —— 重建 compose、重启 docker 都不会丢，
  # 比手工往 DOCKER-USER 里塞一条（还依赖容器 IP）可靠得多。
  # ------------------------------------------------------------------
  dbnet:
    internal: true
