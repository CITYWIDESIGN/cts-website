services:
  db:
    image: postgres:16-alpine
    container_name: mcserver-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mcserver
    ports:
      - "5432:5432"
    volumes:
      - mcserver_db_data:/var/lib/postgresql/data

volumes:
  mcserver_db_data:
