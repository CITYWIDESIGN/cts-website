<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <!-- 占位图：直接替换 public/carousel/08.svg 即可（或改用同名 .jpg/.webp） -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3a2b26"/>
      <stop offset="100%" stop-color="#7a5240"/>
    </linearGradient>
    <pattern id="p" width="32" height="32" patternUnits="userSpaceOnUse" patternTransform="rotate(42)">
      <line x1="0" y1="0" x2="0" y2="32" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#g)"/>
  <rect width="1600" height="900" fill="url(#p)"/>
  <text x="800" y="470" font-family="sans-serif" font-size="64" font-weight="600" fill="#ffffff" fill-opacity="0.28" text-anchor="middle">Slide 08</text>
</svg>
